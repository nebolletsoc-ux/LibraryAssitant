name: Weekly digest

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/system/digest
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            https://libraryassitant.onrender.com/api/system/digest