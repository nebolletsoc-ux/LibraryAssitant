<!doctype html>
<html>
<head>
    <title>Library Assistant</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #142033;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        #app {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .app-header {
            padding: 30px 32px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .app-title {
            margin: 0;
            font-size: 38px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: #101b2d;
        }

        .app-subtitle {
            margin-top: 10px;
            font-size: 20px;
            color: #8793a6;
        }

        .settings-button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            text-align: center;
            color: #68758a;
        }

        .settings-icon {
            width: 34px;
            height: 34px;
            display: block;
            margin: 0 auto 3px;
        }

        .settings-label {
            display: block;
            font-size: 17px;
            font-weight: 600;
        }

        .search-container { padding: 8px 32px 14px; }

        .search-box {
            height: 64px;
            background: #f1f3f6;
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 0 22px;
        }

        .search-icon {
            width: 25px;
            height: 25px;
            flex: 0 0 auto;
            color: #9aa5b5;
        }

        #book-search {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            margin-left: 15px;
            font-size: 23px;
            color: #263348;
        }

        #book-search::placeholder { color: #9aa5b5; }

        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px 20px;
            border-bottom: 1px solid #e4e8ed;
        }

        .filter-left { display: flex; gap: 8px; }

        .filter-pill,
        .available-pill {
            height: 52px;
            border-radius: 28px;
            border: 1px solid #dce1e8;
            background: white;
            color: #69768a;
            font-size: 21px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-pill { padding: 0 22px; }
        .available-pill { padding: 0 18px; }

        .filter-pill.active,
        .available-pill.active {
            background: #111b2c;
            border-color: #111b2c;
            color: white;
        }

        .filter-pill-icon {
            width: 22px;
            height: 22px;
        }

        .available-circle {
            width: 21px;
            height: 21px;
            border: 3px solid #aeb8c6;
            border-radius: 50%;
        }

        .available-count {
            background: #c9f6d8;
            color: #159447;
            min-width: 38px;
            height: 34px;
            padding: 0 9px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        #status {
            padding: 12px 32px;
            font-size: 14px;
            color: #7d8999;
        }

        #status strong { font-weight: 600; }

        .progress,
        #progress-text,
        #filter-controls,
        #summary {
            display: none !important;
        }

        #books-container { width: 100%; }

        .book {
            min-height: 114px;
            padding: 22px 32px 20px 34px;
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr) auto;
            column-gap: 20px;
            align-items: center;
            border-bottom: 1px solid #e1e8e5;
            border-left: 5px solid transparent;
            background: white;
        }

        .book.has-availability {
            background: #effcf3;
            border-left-color: #42d77c;
        }

        .indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .indicator.available { background: #18a957; }
        .indicator.waitlist { background: #f3a329; }
        .indicator.checking { background: #c8ced7; }
        .indicator.error { background: #dc3545; }

        .book-info { min-width: 0; }

        .book-title {
            display: block;
            font-size: 27px;
            line-height: 1.15;
            font-weight: 700;
            color: #152033;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .book-title:hover { text-decoration: underline; }

        .author {
            display: block;
            margin-top: 7px;
            font-size: 23px;
            line-height: 1.1;
            color: #6d7a8e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-formats {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 12px;
        }

        .format-icon {
            width: 27px;
            height: 27px;
            display: block;
        }

        .format-icon.available { color: #08a74d; }
        .format-icon.waitlist { color: #cbd2dc; }
        .format-icon.unavailable { color: #d5dbe3; }

        .csv-import {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 35, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: white;
            border-radius: 18px;
            width: 100%;
            max-width: 560px;
            max-height: 82vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,.18);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            background: #f1f3f6;
            color: #68758a;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
        }

        .modal-close:hover { background: #e6e9ee; }

        .synopsis-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding-right: 44px;
        }

        .synopsis-header .indicator {
            margin-top: 10px;
            flex: 0 0 auto;
        }

        .synopsis-title {
            margin: 0 0 6px 0;
            font-size: 27px;
            line-height: 1.15;
            color: #152033;
        }

        .synopsis-author {
            margin: 0 0 22px 24px;
            color: #6d7a8e;
            font-size: 18px;
        }

        .synopsis-body {
            margin: 0;
            color: #303b4d;
            font-size: 17px;
            line-height: 1.65;
        }

        .synopsis-loading {
            color: #7d8999;
            font-style: italic;
        }

        .borrow-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e4e8ed;
        }

        .borrow-section-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #8793a6;
            margin-bottom: 12px;
        }

        .borrow-option {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #e4e8ed;
            background: white;
        }

        .borrow-option:first-child { margin-top: 0; }

        .borrow-option.available { background: #effcf3; border-color: #bdeecb; }
        .borrow-option.waitlist { background: #fff7e9; border-color: #f6ddab; }
        .borrow-option.unavailable { background: #f7f8fa; border-color: #e4e8ed; }

        .borrow-icon-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            background: white;
        }

        .borrow-icon-wrap svg { width: 20px; height: 20px; }

        .borrow-option.available .borrow-icon-wrap { color: #08a74d; }
        .borrow-option.waitlist .borrow-icon-wrap { color: #d98a10; }
        .borrow-option.unavailable .borrow-icon-wrap { color: #aeb8c6; }

        .borrow-info { flex: 1 1 auto; min-width: 0; }

        .borrow-format {
            display: block;
            font-size: 17px;
            font-weight: 700;
            color: #152033;
        }

        .borrow-source {
            display: block;
            margin-top: 2px;
            font-size: 14px;
            color: #6d7a8e;
        }

        .borrow-wait-estimate {
            color: #d98a10;
            font-weight: 600;
        }

        .borrow-action {
            flex: 0 0 auto;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .borrow-action.available { background: #18a957; color: white; }
        .borrow-action.waitlist { background: #f3a329; color: white; }

        .borrow-status-text {
            flex: 0 0 auto;
            font-size: 14px;
            color: #9aa5b5;
        }

        .config-modal h2 {
            margin: 0 40px 4px 0;
            font-size: 22px;
        }

        .config-modal p {
            margin: 0 0 16px;
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        .library-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .library-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: normal;
        }

        .custom-library-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .custom-library-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 9px;
            background: #f5f6f8;
            border-radius: 6px;
            font-size: 13px;
        }

        .remove-library {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 12px;
        }

        .add-library-fields {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-library-fields input {
            padding: 7px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .secondary-button,
        .primary-button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .secondary-button {
            background: #eef0f3;
            border: 1px solid #ddd;
        }

        .primary-button {
            background: #0366d6;
            color: white;
            border: none;
        }

        @media (max-width: 600px) {
            .app-header { padding: 24px 20px 14px; }
            .app-title { font-size: 32px; }
            .app-subtitle { font-size: 17px; }
            .settings-label { font-size: 15px; }
            .search-container { padding: 8px 20px 12px; }
            .search-box { height: 58px; }
            #book-search { font-size: 19px; }
            .filter-bar {
                padding: 0 20px 16px;
                overflow-x: auto;
            }
            .filter-pill {
                height: 46px;
                padding: 0 17px;
                font-size: 18px;
                white-space: nowrap;
            }
            .available-pill {
                height: 46px;
                font-size: 18px;
                white-space: nowrap;
            }
            .book {
                min-height: 104px;
                padding: 19px 18px 18px 20px;
                grid-template-columns: 14px minmax(0, 1fr) auto;
                column-gap: 16px;
            }
            .book-title { font-size: 21px; }
            .author { font-size: 18px; margin-top: 6px; }
            .book-formats { gap: 9px; padding-left: 5px; }
            .format-icon { width: 23px; height: 23px; }
            .modal { padding: 24px 20px; }
            .synopsis-title { font-size: 23px; }
            .synopsis-body { font-size: 16px; }
        }
    
        .upload-section {
            margin: 16px 0;
            padding: 12px 14px;
            background: #f5f5f5;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .upload-label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        #books_file {
            font-size: 13px;
            cursor: pointer;
        }

</style>
</head>

<body>

<div id="app">

    <header class="app-header">
        <div>
            <h1 class="app-title">Library Assistant</h1>
            <div class="app-subtitle">
                <span id="book-count">0 books</span> · StoryGraph
            </div>
        </div>

        <button id="config-gear" class="settings-button" title="Library settings" type="button">
            <svg class="settings-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.46 15a1.7 1.7 0 0 0-1.56-1.03H6.7v-2.4h.2A1.7 1.7 0 0 0 8.46 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 12.73 5.2V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03h.2v2.4h-.2A1.7 1.7 0 0 0 19.4 15z"/>
            </svg>
            <span class="settings-label">My Libraries</span>
        </button>
    </header>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-4-4"/>
            </svg>
            <input id="book-search" type="search"
                   placeholder="Search books or authors..." autocomplete="off">
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <button class="filter-pill active" data-format="all" type="button">All</button>

            <button class="filter-pill" data-format="ebook" type="button">
                <svg class="filter-pill-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.7">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/>
                    <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
                </svg>
                eBook
            </button>

            <button class="filter-pill" data-format="audiobook" type="button">
                <svg class="filter-pill-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.7">
                    <path d="M4 13a8 8 0 0 1 16 0"/>
                    <path d="M4 13v5a2 2 0 0 0 2 2h1v-7H4z"/>
                    <path d="M20 13v5a2 2 0 0 1-2 2h-1v-7h3z"/>
                </svg>
                Audio
            </button>
        </div>

        <button class="available-pill active" id="available-filter" type="button">
            <span class="available-circle"></span>
            Available
            <span class="available-count" id="available-count">0</span>
        </button>
    </div>

    <div class="csv-import">
        <input type="file" id="books_file" name="books_file"
               accept=".csv,text/csv">
    </div>

    <button
        type="button"
        id="import-csv-button"
        style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 500;
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background: #111b2c;
            color: white;
            cursor: pointer;
            font-size: 13px;
        "
    >
        Import CSV
    </button>

    <div id="status">
        <strong>Status:</strong> Select your CSV file to begin.
    </div>

    <div class="progress"><div id="progress-bar"></div></div>
    <p id="progress-text"></p>
    <div id="filter-controls"></div>
    <div id="summary"></div>
    <div id="books-container"></div>
</div>

<div id="synopsis-overlay" class="modal-overlay" role="dialog"
     aria-modal="true" aria-labelledby="synopsis-title">
    <div class="modal">
        <button id="synopsis-close" class="modal-close" type="button"
                aria-label="Close synopsis">&times;</button>

        <div class="synopsis-header">
            <span id="synopsis-dot" class="indicator"></span>
            <h2 id="synopsis-title" class="synopsis-title"></h2>
        </div>
        <p id="synopsis-author" class="synopsis-author"></p>
        <p id="synopsis-body" class="synopsis-body"></p>

        <div class="borrow-section">
            <div class="borrow-section-label">Borrow options</div>
            <div id="borrow-options"></div>
        </div>
    </div>
</div>

<div id="config-overlay" class="modal-overlay" role="dialog"
     aria-modal="true" aria-labelledby="config-title">
    <div class="modal config-modal">
        <button id="config-close" class="modal-close" type="button"
                aria-label="Close library settings">&times;</button>

        <h2 id="config-title">Library settings</h2>
        <p>Choose which libraries to search. No login is required — we only check public catalog availability.</p>

        <div class="library-options">
            <label class="library-option">
                <input type="checkbox" id="lib-oakland" checked>
                Oakland Public Library
            </label>
            <label class="library-option">
                <input type="checkbox" id="lib-berkeley" checked>
                Berkeley Public Library
            </label>
            <label class="library-option">
                <input type="checkbox" id="lib-redwood_city">
                Redwood City Public Library
            </label>
            <label class="library-option">
                <input type="checkbox" id="lib-hoopla" checked>
                Hoopla
            </label>
        </div>

        <div id="custom-library-list" class="custom-library-list"></div>

        <details style="margin-bottom:16px;">
            <summary style="cursor:pointer;font-size:13px;color:#0366d6;">
                Add another library
            </summary>

            <div class="add-library-fields">
                <p style="margin:0;font-size:12px;color:#666;">
                    Works for any library on Bibliocommons or OverDrive/Libby.
                </p>
                <input id="custom-lib-name" type="text" placeholder="Library name">
                <input id="custom-lib-bibliocommons" type="text"
                       placeholder="Bibliocommons subdomain (optional)">
                <input id="custom-lib-overdrive" type="text"
                       placeholder="OverDrive/Libby subdomain (optional)">
                <button id="custom-lib-add" class="secondary-button"
                        type="button">Add library</button>
            </div>
        </details>

        <button id="config-save" class="primary-button" type="button">
            Save & Continue
        </button>
    </div>
</div>

<script>
let jobId = null;
let statusTimer = null;
let allBooks = [];

let currentFilters = {
    format: "all",
    availability: "available"
};

const LIBRARY_CONFIG_KEY = "libraryAssistant.libraries";
const PRESET_LIBRARIES = ["oakland", "berkeley", "redwood_city", "hoopla"];

function loadLibraryConfig() {
    try {
        const raw = localStorage.getItem(LIBRARY_CONFIG_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (e) {
        return null;
    }
}

function saveLibraryConfig(config) {
    localStorage.setItem(LIBRARY_CONFIG_KEY, JSON.stringify(config));
}

let modalCustomLibraries = [];

function renderCustomLibraryList(customLibraries) {
    const list = document.getElementById("custom-library-list");
    list.innerHTML = "";

    customLibraries.forEach(function(lib, index) {
        const row = document.createElement("div");
        row.className = "custom-library-row";

        const label = document.createElement("span");
        label.textContent = lib.name || lib.key;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-library";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", function() {
            customLibraries.splice(index, 1);
            renderCustomLibraryList(customLibraries);
        });

        row.appendChild(label);
        row.appendChild(removeBtn);
        list.appendChild(row);
    });
}

function defaultLibraryConfig() {
    return {
        oakland: true,
        berkeley: true,
        redwood_city: false,
        hoopla: true,
        custom: []
    };
}

function applyLibraryConfigToCheckboxes(config) {
    document.getElementById("lib-oakland").checked = !!config.oakland;
    document.getElementById("lib-berkeley").checked = !!config.berkeley;
    document.getElementById("lib-redwood_city").checked = !!config.redwood_city;
    document.getElementById("lib-hoopla").checked = !!config.hoopla;
}

function openConfigModal() {
    const config = loadLibraryConfig() || defaultLibraryConfig();

    applyLibraryConfigToCheckboxes(config);

    modalCustomLibraries = (config.custom || []).slice();
    renderCustomLibraryList(modalCustomLibraries);

    document.getElementById("config-overlay").style.display = "flex";
}

function closeConfigModal(save = true) {
    if (save) {
        saveLibraryConfig({
            oakland: document.getElementById("lib-oakland").checked,
            berkeley: document.getElementById("lib-berkeley").checked,
            redwood_city: document.getElementById("lib-redwood_city").checked,
            hoopla: document.getElementById("lib-hoopla").checked,
            custom: modalCustomLibraries
        });
    }

    document.getElementById("config-overlay").style.display = "none";
}

function buildLibraryConfigPayload(config) {
    const payload = [];

    PRESET_LIBRARIES.forEach(function(key) {
        if (config[key]) payload.push({ key: key });
    });

    (config.custom || []).forEach(function(lib) {
        payload.push({
            key: lib.key,
            bibliocommons: lib.bibliocommons || null,
            overdrive: lib.overdrive || null,
            hoopla: false
        });
    });

    return payload;
}

document.getElementById("config-gear").addEventListener("click", openConfigModal);
document.getElementById("config-save").addEventListener("click", function() {
    closeConfigModal(true);
});
document.getElementById("config-close").addEventListener("click", function() {
    closeConfigModal(false);
});

document.getElementById("custom-lib-add").addEventListener("click", function() {
    const nameInput = document.getElementById("custom-lib-name");
    const bibliocommonsInput = document.getElementById("custom-lib-bibliocommons");
    const overdriveInput = document.getElementById("custom-lib-overdrive");

    const name = nameInput.value.trim();
    const bibliocommons = bibliocommonsInput.value.trim();
    const overdrive = overdriveInput.value.trim();

    if (!name || (!bibliocommons && !overdrive)) {
        alert("Enter a library name and at least one subdomain.");
        return;
    }

    modalCustomLibraries.push({
        key: name.toLowerCase().replace(/[^a-z0-9]+/g, "_"),
        name: name,
        bibliocommons: bibliocommons || null,
        overdrive: overdrive || null
    });

    renderCustomLibraryList(modalCustomLibraries);

    nameInput.value = "";
    bibliocommonsInput.value = "";
    overdriveInput.value = "";
});

if (!loadLibraryConfig()) {
    openConfigModal();
}

document
    .getElementById("import-csv-button")
    .addEventListener("click", function() {
        document.getElementById("books_file").click();
    });

document.getElementById("books_file").addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    document.getElementById("status").innerHTML =
        "<strong>Status:</strong> Uploading CSV…";
    document.getElementById("books-container").innerHTML = "";
    document.getElementById("progress-bar").style.width = "0%";
    document.getElementById("progress-text").textContent = "";

    const formData = new FormData();
    formData.append("books_file", file);

    const libraryConfig = loadLibraryConfig() || defaultLibraryConfig();
    formData.append(
        "libraries",
        JSON.stringify(buildLibraryConfigPayload(libraryConfig))
    );

    try {
        const response = await fetch("/", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Upload failed: " + response.status);
        }

        const data = await response.json();

        if (!data.job_id) {
            throw new Error("Server did not return a job ID.");
        }

        jobId = data.job_id;

        document.getElementById("status").innerHTML =
            "<strong>Status:</strong> Analysis started. " +
            data.total + " books queued.";

        startPolling();
    } catch (error) {
        document.getElementById("status").innerHTML =
            "<strong>Status:</strong> Upload failed: " +
            escapeHtml(error.message);
    }
});

function setupFilterListeners() {
    if (document.body.dataset.filtersSetup === "true") return;
    document.body.dataset.filtersSetup = "true";

    document.querySelectorAll("[data-format]").forEach(function(button) {
        button.addEventListener("click", function() {
            document.querySelectorAll("[data-format]").forEach(function(btn) {
                btn.classList.remove("active");
            });

            this.classList.add("active");
            currentFilters.format = this.dataset.format;
            renderBooks(allBooks, true);
        });
    });

    document.getElementById("available-filter").addEventListener("click", function() {
        const currentlyAvailable = currentFilters.availability === "available";

        currentFilters.availability = currentlyAvailable ? "all" : "available";
        this.classList.toggle("active", !currentlyAvailable);

        renderBooks(allBooks, true);
    });

    document.getElementById("book-search").addEventListener("input", function() {
        renderBooks(allBooks, true);
    });
}

function createFormatIcon(type, result) {
    const wrapper = document.createElement("span");
    wrapper.className = "format-icon " +
        (result.available ? "available" : (result.wait ? "waitlist" : "unavailable"));

    wrapper.innerHTML = type === "ebook"
        ? `
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/>
                <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
            </svg>
        `
        : `
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 13a8 8 0 0 1 16 0"/>
                <path d="M4 13v5a2 2 0 0 0 2 2h1v-7H4z"/>
                <path d="M20 13v5a2 2 0 0 1-2 2h-1v-7h3z"/>
            </svg>
        `;

    if (result.url) {
        const link = document.createElement("a");
        link.href = result.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.color = "inherit";
        link.style.textDecoration = "none";
        link.appendChild(wrapper);
        return link;
    }

    return wrapper;
}

function getResults(book) {
    return book.oakland || [];
}

function getBookStatus(book) {
    const results = getResults(book);

    if (results.some(r => r.available === true)) return "available";
    if (results.some(r => r.available === false && r.wait)) return "waitlist";
    return "unavailable";
}

function renderBooks(books, isFiltering) {
    const container = document.getElementById("books-container");

    if (!isFiltering) {
        allBooks = books || [];
        setupFilterListeners();
    }

    let filteredBooks = allBooks.slice();

    const searchText =
        (document.getElementById("book-search").value || "").trim().toLowerCase();

    if (searchText) {
        filteredBooks = filteredBooks.filter(function(book) {
            return (book.title || "").toLowerCase().includes(searchText) ||
                   (book.author || "").toLowerCase().includes(searchText);
        });
    }

    function resultMatchesFormat(result) {
        const format = (result.format || "").toLowerCase();

        if (currentFilters.format === "audiobook") {
            return format.includes("audio");
        }

        if (currentFilters.format === "ebook") {
            return format.includes("ebook") && !format.includes("audio");
        }

        return true; // "all"
    }

    if (currentFilters.format !== "all") {
        filteredBooks = filteredBooks.filter(function(book) {
            return getResults(book).some(resultMatchesFormat);
        });
    }

    if (currentFilters.availability === "available") {
        filteredBooks = filteredBooks.filter(function(book) {
            return getResults(book).filter(resultMatchesFormat).some(r => r.available === true);
        });
    }

    filteredBooks.sort(function(a, b) {
        const rank = { available: 0, waitlist: 1, unavailable: 2 };
        return rank[getBookStatus(a)] - rank[getBookStatus(b)];
    });

    let availableCount = 0;
    allBooks.forEach(function(book) {
        if (getResults(book).filter(resultMatchesFormat).some(r => r.available === true)) {
            availableCount++;
        }
    });

    document.getElementById("available-count").textContent = availableCount;
    document.getElementById("book-count").textContent =
        allBooks.length + (allBooks.length === 1 ? " book" : " books");

    container.innerHTML = "";

    filteredBooks.forEach(function(book) {
        const results = getResults(book);
        const status = getBookStatus(book);

        const row = document.createElement("div");
        row.className = "book";
        if (status === "available") row.classList.add("has-availability");

        const indicator = document.createElement("div");
        indicator.className = "indicator " + (
            book.state === "error" ? "error" :
            book.state !== "complete" ? "checking" :
            status === "available" ? "available" :
            status === "waitlist" ? "waitlist" : "checking"
        );

        const info = document.createElement("div");
        info.className = "book-info";

        const title = document.createElement("span");
        title.className = "book-title";
        title.textContent = book.title;
        title.title = "Click to read synopsis";
        title.addEventListener("click", function() {
            openSynopsisModal(book);
        });

        const author = document.createElement("span");
        author.className = "author";
        author.textContent = book.author || "";

        info.appendChild(title);
        info.appendChild(author);

        const formats = document.createElement("div");
        formats.className = "book-formats";

        const ebookResults = results.filter(function(result) {
            const format = (result.format || "").toLowerCase();
            return format.includes("ebook") && !format.includes("audio");
        });

        const audioResults = results.filter(function(result) {
            return (result.format || "").toLowerCase().includes("audio");
        });

        if (ebookResults.length) {
            const best = ebookResults.find(r => r.available) || ebookResults[0];
            formats.appendChild(createFormatIcon("ebook", best));
        }

        if (audioResults.length) {
            const best = audioResults.find(r => r.available) || audioResults[0];
            formats.appendChild(createFormatIcon("audio", best));
        }

        row.appendChild(indicator);
        row.appendChild(info);
        row.appendChild(formats);
        container.appendChild(row);
    });
}

async function openSynopsisModal(book) {
    const overlay = document.getElementById("synopsis-overlay");
    const dot = document.getElementById("synopsis-dot");
    const title = document.getElementById("synopsis-title");
    const author = document.getElementById("synopsis-author");
    const body = document.getElementById("synopsis-body");

    const status = getBookStatus(book);

    dot.className = "indicator " + (
        book.state === "error" ? "error" :
        book.state !== "complete" ? "checking" :
        status === "available" ? "available" :
        status === "waitlist" ? "waitlist" : "checking"
    );

    title.textContent = book.title || "";
    author.textContent = book.author || "";
    body.className = "synopsis-body synopsis-loading";
    body.textContent = "Loading synopsis…";
    overlay.style.display = "flex";

    renderBorrowOptions(book);

    try {
        let synopsis = book.synopsis || "";

        // If the backend already supplies a synopsis, use it.
        // Otherwise use Open Library's public API as a fallback.
        if (!synopsis) {
            const params = new URLSearchParams();

            if (book.isbn) {
                params.set("isbn", book.isbn);
            } else {
                params.set("title", book.title || "");
                if (book.author) params.set("author", book.author);
            }

            const response = await fetch(
                "https://openlibrary.org/search.json?" +
                params.toString() +
                "&limit=1"
            );

            if (response.ok) {
                const data = await response.json();
                const doc = (data.docs || [])[0];

                if (doc) {
                    synopsis =
                        (doc.first_sentence && Array.isArray(doc.first_sentence)
                            ? doc.first_sentence.join(" ")
                            : doc.first_sentence) ||
                        doc.subtitle ||
                        "";
                }
            }
        }

        body.className = "synopsis-body";

        if (synopsis) {
            body.textContent = stripHtml(synopsis);
        } else {
            body.textContent =
                "No synopsis is available for this book.";
        }
    } catch (error) {
        console.error("Synopsis lookup failed:", error);
        body.className = "synopsis-body";
        body.textContent =
            "A synopsis could not be retrieved right now.";
    }
}

function renderBorrowOptions(book) {
    const container = document.getElementById("borrow-options");
    container.innerHTML = "";

    const results = getResults(book);
    const combos = {};

    results.forEach(function(result) {
        const format = result.format || "Digital";
        const provider = result.provider || "Unknown";
        const library = result.library || "Unknown";
        const key = format + "|" + provider + "|" + library;

        if (!combos[key] || (result.available && !combos[key].available)) {
            combos[key] = {
                format: format,
                provider: provider,
                library: library,
                available: !!result.available,
                wait: !!result.wait,
                url: result.url,
                holds: (typeof result.holds === "number") ? result.holds : null,
                waitWeeks: (typeof result.waitWeeks === "number") ? result.waitWeeks : null
            };
        }
    });

    const comboList = Object.values(combos);

    if (comboList.length === 0) {
        const empty = document.createElement("p");
        empty.className = "synopsis-body";
        empty.style.color = "#9aa5b5";
        empty.textContent = "No borrow options found yet.";
        container.appendChild(empty);
        return;
    }

    comboList.sort(function(a, b) {
        function rank(c) {
            if (c.available) return 0;
            if (c.wait) return 1;
            return 2;
        }
        return rank(a) - rank(b);
    });

    comboList.forEach(function(combo) {
        const row = document.createElement("div");

        let statusClass = "unavailable";
        if (combo.available) {
            statusClass = "available";
        } else if (combo.wait) {
            statusClass = "waitlist";
        }

        row.className = "borrow-option " + statusClass;

        const iconWrap = document.createElement("div");
        iconWrap.className = "borrow-icon-wrap";

        const isAudio = combo.format.toLowerCase().includes("audio");

        iconWrap.innerHTML = isAudio
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13v5a2 2 0 0 0 2 2h1v-7H4z"/><path d="M20 13v5a2 2 0 0 1-2 2h-1v-7h3z"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>`;

        const info = document.createElement("div");
        info.className = "borrow-info";

        const formatLabel = document.createElement("span");
        formatLabel.className = "borrow-format";
        formatLabel.textContent = combo.format;

        const sourceLabel = document.createElement("span");
        sourceLabel.className = "borrow-source";
        sourceLabel.textContent = combo.provider + " · " + combo.library;

        if (statusClass === "waitlist") {
            const weeks = (combo.waitWeeks !== null)
                ? combo.waitWeeks
                : (combo.holds !== null ? Math.round(combo.holds * 1.5) : null);

            if (weeks !== null) {
                const waitSpan = document.createElement("span");
                waitSpan.className = "borrow-wait-estimate";

                let waitText = "";
                if (combo.holds !== null) {
                    waitText += " · " + combo.holds + (combo.holds === 1 ? " hold" : " holds");
                }
                waitText += " · ~" + weeks + (weeks === 1 ? " week" : " weeks");

                waitSpan.textContent = waitText;
                sourceLabel.appendChild(waitSpan);
            }
        }

        info.appendChild(formatLabel);
        info.appendChild(sourceLabel);

        row.appendChild(iconWrap);
        row.appendChild(info);

        if (combo.available && combo.url) {
            const action = document.createElement("a");
            action.className = "borrow-action available";
            action.href = combo.url;
            action.target = "_blank";
            action.rel = "noopener noreferrer";
            action.textContent = "Borrow";
            row.appendChild(action);
        } else if (combo.wait && combo.url) {
            const action = document.createElement("a");
            action.className = "borrow-action waitlist";
            action.href = combo.url;
            action.target = "_blank";
            action.rel = "noopener noreferrer";
            action.textContent = "Join Waitlist";
            row.appendChild(action);
        } else {
            const status = document.createElement("span");
            status.className = "borrow-status-text";
            status.textContent = "Unavailable";
            row.appendChild(status);
        }

        container.appendChild(row);
    });
}

function closeSynopsisModal() {
    document.getElementById("synopsis-overlay").style.display = "none";
}

document.getElementById("synopsis-close").addEventListener(
    "click",
    closeSynopsisModal
);

document.getElementById("synopsis-overlay").addEventListener(
    "click",
    function(event) {
        if (event.target === this) closeSynopsisModal();
    }
);

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        document.getElementById("synopsis-overlay").style.display = "none";
        document.getElementById("config-overlay").style.display = "none";
    }
});

function startPolling() {
    if (statusTimer) clearInterval(statusTimer);
    pollStatus();
    statusTimer = setInterval(pollStatus, 500);
}

async function pollStatus() {
    if (!jobId) return;

    try {
        const response = await fetch(
            "/status?job_id=" + encodeURIComponent(jobId)
        );

        if (!response.ok) {
            throw new Error("Status request failed: " + response.status);
        }

        const data = await response.json();

        const total = data.total;
        const completed = data.completed;
        const percent = total
            ? Math.round(completed / total * 100)
            : 0;

        document.getElementById("progress-bar").style.width =
            percent + "%";

        document.getElementById("progress-text").textContent =
            completed + " of " + total + " books analyzed";

        document.getElementById("status").innerHTML =
            data.finished
                ? "<strong>Status:</strong> Analysis complete."
                : "<strong>Status:</strong> Analyzing books…";

        renderBooks(data.books || []);
    } catch (error) {
        console.error("Status error:", error);
    }
}

function stripHtml(value) {
    const div = document.createElement("div");
    div.innerHTML = value || "";
    return (div.textContent || div.innerText || "").trim();
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
