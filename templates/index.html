<!doctype html>
<html>
<head>
    <title>Library Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 1100px;
        }

        .status {
            margin: 15px 0 10px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-left: 4px solid #4a90e2;
            border-radius: 4px;
        }

        .progress {
            width: 100%;
            background: #eee;
            border-radius: 999px;
            overflow: hidden;
            height: 8px;
            margin-top: 8px;
        }

        .progress > div {
            height: 100%;
            width: 0%;
            background: #4a90e2;
            transition: width 0.2s ease;
        }

        #progress-text {
            margin: 6px 0 14px;
            color: #666;
            font-size: 14px;
        }

        .summary {
            margin: 12px 0 20px;
            font-weight: bold;
        }

        .book {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 4px 12px;
            border-bottom: 1px solid #ddd;
        }

        .indicator {
            width: 12px;
            flex: 0 0 12px;
            font-size: 16px;
            line-height: 20px;
        }

        .indicator.available {
            color: #168329;
        }

        .indicator.waitlist {
            color: #c27b00;
        }

        .indicator.none {
            color: #999;
        }

        .book-main {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-weight: bold;
        }

        .author {
            color: #555;
        }

        .library-section {
            margin-top: 6px;
        }

        .library-name {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 2px;
        }

        .provider-section {
            margin-left: 12px;
            margin-bottom: 3px;
        }

        .provider-name {
            color: #555;
            font-size: 13px;
            margin-right: 5px;
        }

        .result {
            display: inline-block;
            margin-right: 12px;
            margin-top: 2px;
            font-size: 14px;
        }

        .available {
            color: #168329;
        }

        .waitlist {
            color: #b36b00;
        }

        .no-match {
            color: #777;
        }

        .no-library-match {
            color: #777;
            font-size: 13px;
            margin-left: 12px;
        }

        a {
            color: #06c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            margin-left: 8px;
        }
    </style>
</head>

<body>

<h1>Library Assistant</h1>

<p>
    This page shows your StoryGraph or Goodreads
    “want to read” books and highlights Libby or Hoopla
    matches at Oakland and Berkeley libraries.
</p>

<form id="upload-form">

    <label for="books_file">
        Import a CSV export:
    </label>

    <input
        type="file"
        id="books_file"
        name="books_file"
        accept=".csv,text/csv"
        required
    >

    <button type="submit">
        Analyze books
    </button>

</form>

<div id="status" class="status">
    <strong>Status:</strong>
    Select your CSV file and click Analyze books.
</div>

<div class="progress">
    <div id="progress-bar"></div>
</div>

<p id="progress-text"></p>

<div id="summary" class="summary"></div>

<div id="books-container"></div>


<script>

let jobId = null;
let statusTimer = null;


document
    .getElementById("upload-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const fileInput =
            document.getElementById("books_file");

        const file = fileInput.files[0];

        if (!file) {
            return;
        }

        document.getElementById("status").innerHTML =
            "<strong>Status:</strong> Uploading CSV…";

        document.getElementById("summary").innerHTML = "";

        document.getElementById("books-container").innerHTML = "";

        document.getElementById("progress-bar").style.width = "0%";

        document.getElementById("progress-text").textContent = "";

        const formData = new FormData();

        formData.append("books_file", file);

        try {

            const response = await fetch("/", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(
                    "Upload failed: " + response.status
                );
            }

            const data = await response.json();

            if (!data.job_id) {
                throw new Error(
                    "Server did not return a job ID."
                );
            }

            jobId = data.job_id;

            document.getElementById("status").innerHTML =
                "<strong>Status:</strong> Analysis started. " +
                data.total +
                " books queued.";

            startPolling();

        } catch (error) {

            document.getElementById("status").innerHTML =
                "<strong>Status:</strong> Upload failed: " +
                escapeHtml(error.message);
        }
    });


function startPolling() {

    if (statusTimer) {
        clearInterval(statusTimer);
    }

    pollStatus();

    statusTimer = setInterval(
        pollStatus,
        500
    );
}


async function pollStatus() {

    if (!jobId) {
        return;
    }

    try {

        const response = await fetch(
            "/status?job_id=" +
            encodeURIComponent(jobId)
        );

        if (!response.ok) {
            throw new Error(
                "Status request failed: " +
                response.status
            );
        }

        const data = await response.json();

        const total = data.total;

        const completed = data.completed;

        const percent = total
            ? Math.round(completed / total * 100)
            : 0;

        document.getElementById(
            "progress-bar"
        ).style.width = percent + "%";

        document.getElementById(
            "progress-text"
        ).textContent =
            completed +
            " of " +
            total +
            " books analyzed";

        if (data.finished) {

            clearInterval(statusTimer);

            document.getElementById(
                "status"
            ).innerHTML =
                "<strong>Status:</strong> Analysis complete.";

        } else {

            document.getElementById(
                "status"
            ).innerHTML =
                "<strong>Status:</strong> Analyzing books…";
        }

        renderBooks(data.books);

    } catch (error) {

        console.error(
            "Status error:",
            error
        );
    }
}


function renderBooks(books) {

    const container =
        document.getElementById(
            "books-container"
        );

    const summary =
        document.getElementById(
            "summary"
        );

    container.innerHTML = "";

    let availableBooks = 0;
    let waitlistBooks = 0;
    let noMatchBooks = 0;


    books.forEach(function(book) {

        const results =
            book.oakland || [];

        const availableResults =
            results.filter(
                result => result.available
            );

        const waitlistResults =
            results.filter(
                result =>
                    !result.available &&
                    result.wait
            );

        if (availableResults.length > 0) {
            availableBooks++;
        }

        if (waitlistResults.length > 0) {
            waitlistBooks++;
        }

        if (
            availableResults.length === 0 &&
            waitlistResults.length === 0
        ) {
            noMatchBooks++;
        }


        const div =
            document.createElement("div");

        div.className = "book";


        let indicatorClass = "none";
        let indicator = "○";

        if (availableResults.length > 0) {

            indicatorClass = "available";
            indicator = "●";

        } else if (waitlistResults.length > 0) {

            indicatorClass = "waitlist";
            indicator = "●";
        }


        let html =
            '<div class="indicator ' +
            indicatorClass +
            '">' +
            indicator +
            "</div>";


        html += '<div class="book-main">';

        html +=
            '<span class="book-title">' +
            escapeHtml(book.title) +
            "</span>";

        if (book.author) {

            html +=
                ' <span class="author">— ' +
                escapeHtml(book.author) +
                "</span>";
        }


        /*
         * Group results first by library, then provider.
         *
         * Current expected libraries:
         *   Oakland
         *   Berkeley
         *
         * Current expected providers:
         *   Hoopla
         *   Libby
         */
        const libraries = {};

        results.forEach(function(result) {

            const library =
                normalizeLibraryName(
                    result.library
                );

            const provider =
                result.provider ||
                "Other";

            if (!libraries[library]) {
                libraries[library] = {};
            }

            if (!libraries[library][provider]) {
                libraries[library][provider] = [];
            }

            libraries[library][provider].push(
                result
            );
        });


        html += '<div class="library-section">';


        /*
         * Always show the two libraries so that
         * it is immediately clear where results
         * were and were not found.
         */
        const libraryOrder = [
            "Oakland",
            "Berkeley"
        ];


        let anyLibraryResult = false;


        libraryOrder.forEach(function(libraryName) {

            const providerGroups =
                libraries[libraryName];

            html +=
                '<div class="library-name">' +
                escapeHtml(libraryName) +
                "</div>";


            if (
                !providerGroups ||
                Object.keys(providerGroups).length === 0
            ) {

                html +=
                    '<div class="no-library-match">' +
                    "No current match" +
                    "</div>";

                return;
            }


            anyLibraryResult = true;


            const providerOrder = [
                "Libby",
                "Hoopla"
            ];


            const providers =
                Object.keys(providerGroups);


            const orderedProviders =
                providerOrder
                    .filter(
                        provider =>
                            providers.includes(provider)
                    )
                    .concat(
                        providers.filter(
                            provider =>
                                !providerOrder.includes(
                                    provider
                                )
                        )
                    );


            orderedProviders.forEach(
                function(provider) {

                    const providerResults =
                        providerGroups[provider];


                    html +=
                        '<div class="provider-section">';

                    html +=
                        '<span class="provider-name">' +
                        escapeHtml(provider) +
                        ":</span>";


                    /*
                     * Group identical format/status
                     * results, but retain every URL.
                     *
                     * This produces:
                     *
                     * Hoopla: Audiobook ×3 · Available
                     *
                     * while keeping individual links
                     * underneath.
                     */
                    const groups =
                        groupResults(
                            providerResults
                        );


                    groups.forEach(
                        function(group) {

                            html +=
                                renderResultGroup(
                                    group
                                );
                        }
                    );


                    html += "</div>";
                }
            );
        });


        /*
         * If there were somehow a library name other
         * than Oakland/Berkeley, don't silently lose it.
         */
        Object.keys(libraries)
            .filter(
                name =>
                    !libraryOrder.includes(name)
            )
            .forEach(function(libraryName) {

                const providerGroups =
                    libraries[libraryName];

                html +=
                    '<div class="library-name">' +
                    escapeHtml(libraryName) +
                    "</div>";

                Object.keys(providerGroups)
                    .forEach(function(provider) {

                        html +=
                            '<div class="provider-section">' +
                            '<span class="provider-name">' +
                            escapeHtml(provider) +
                            ":</span>";

                        groupResults(
                            providerGroups[provider]
                        ).forEach(
                            function(group) {
                                html +=
                                    renderResultGroup(
                                        group
                                    );
                            }
                        );

                        html += "</div>";
                    });
            });


        /*
         * If there are absolutely no results,
         * the library sections above already say
         * "No current match."
         */
        html += "</div>";

        html += "</div>";

        div.innerHTML = html;

        container.appendChild(div);
    });


    summary.textContent =
        books.length +
        " analyzed • " +
        availableBooks +
        " with availability • " +
        waitlistBooks +
        " with waitlists • " +
        noMatchBooks +
        " with no current match";
}


/*
 * Normalize library names returned by Python.
 */
function normalizeLibraryName(library) {

    if (!library) {
        return "Other";
    }

    const value =
        String(library).toLowerCase();

    if (value.includes("oakland")) {
        return "Oakland";
    }

    if (value.includes("berkeley")) {
        return "Berkeley";
    }

    return String(library);
}


/*
 * Group results by format + availability/wait status.
 *
 * We don't discard duplicate editions.
 */
function groupResults(results) {

    const groups = {};

    results.forEach(function(result) {

        const format =
            result.format ||
            "Digital";

        let status;

        if (result.available) {
            status = "available";
        } else if (result.wait) {
            status = "waitlist";
        } else {
            status = "unavailable";
        }

        const key =
            format +
            "|" +
            status;

        if (!groups[key]) {

            groups[key] = {
                format: format,
                status: status,
                results: []
            };
        }

        groups[key].results.push(
            result
        );
    });

    return Object.values(groups);
}


/*
 * Render one grouped result.
 *
 * Example:
 *
 * Hoopla:
 *   Audiobook ×3 · Available
 *
 * Each individual edition remains clickable.
 */
function renderResultGroup(group) {

    const results =
        group.results;

    let statusText = "";

    let statusClass =
        group.status;


    if (group.status === "available") {

        statusText = "Available";

    } else if (group.status === "waitlist") {

        statusText =
            results[0].wait === "Waitlist"
                ? "Waitlist"
                : (
                    results[0].wait ||
                    "Waitlist"
                );

    } else {

        statusText =
            "Not currently available";
    }


    let countText = "";

    if (results.length > 1) {

        countText =
            " ×" +
            results.length;
    }


    let html =
        '<span class="result">';


    /*
     * If there is only one result, make the
     * format itself the link.
     */
    if (results.length === 1) {

        const result =
            results[0];

        const label =
            group.format +
            countText;

        if (result.url) {

            html +=
                '<a href="' +
                escapeHtml(result.url) +
                '" target="_blank" rel="noopener">' +
                "<strong>" +
                escapeHtml(label) +
                "</strong>" +
                "</a>";

        } else {

            html +=
                "<strong>" +
                escapeHtml(label) +
                "</strong>";
        }


        html +=
            " · " +
            '<span class="' +
            statusClass +
            '">' +
            escapeHtml(statusText) +
            "</span>";


        html += "</span>";

        return html;
    }


    /*
     * Multiple editions:
     *
     * Hoopla Audiobook ×3 · Available
     *
     * followed by individual links.
     */
    html +=
        "<strong>" +
        escapeHtml(
            group.format + countText
        ) +
        "</strong>" +
        " · " +
        '<span class="' +
        statusClass +
        '">' +
        escapeHtml(statusText) +
        "</span>";


    results.forEach(function(result, index) {

        if (!result.url) {
            return;
        }

        html +=
            " " +
            '<a href="' +
            escapeHtml(result.url) +
            '" target="_blank" rel="noopener">' +
            "[View " +
            (index + 1) +
            "]" +
            "</a>";
    });


    html += "</span>";

    return html;
}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
