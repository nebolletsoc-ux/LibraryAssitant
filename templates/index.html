<!doctype html>
<html>
<head>
    <title>Library Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 12px;
            max-width: 800px;
            background: #fafafa;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        p {
            margin: 0 0 12px 0;
            color: #555;
            font-size: 14px;
            line-height: 1.4;
        }

        form {
            margin: 12px 0 16px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        label {
            font-weight: 500;
            font-size: 14px;
        }

        input[type="file"] {
            font-size: 14px;
            flex: 1;
            min-width: 180px;
        }

        .status {
            margin: 12px 0;
            padding: 8px 12px;
            background: #f0f4f8;
            border-left: 4px solid #0366d6;
            border-radius: 4px;
            font-size: 14px;
        }

        .status strong {
            display: block;
            margin-bottom: 2px;
        }

        .progress {
            width: 100%;
            height: 6px;
            background: #e5e5e5;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress > div {
            height: 100%;
            background: #28a745;
            transition: width 0.2s ease;
        }

        #progress-text {
            margin: 4px 0;
            color: #666;
            font-size: 12px;
        }

        .summary {
            margin: 8px 0 12px 0;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .book {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px;
            align-items: flex-start;
            padding: 8px 10px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
            background: white;
            border-radius: 3px;
            margin-bottom: 2px;
        }

        .indicator {
            font-size: 24px;
            line-height: 1;
            text-align: center;
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .indicator.available {
            color: white;
            background: #28a745;
        }

        .indicator.waitlist {
            color: white;
            background: #ff9800;
        }

        .indicator.error {
            color: white;
            background: #dc3545;
        }

        .indicator.checking {
            color: white;
            background: #6c757d;
        }

        .book-info {
            min-width: 0;
            flex: 1;
        }

        .book-title {
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .author {
            color: #777;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .book-availability {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .availability-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .availability-item.available {
            color: #28a745;
            font-weight: 500;
        }

        .availability-item.waitlist {
            color: #ff9800;
        }

        .availability-item.unavailable {
            color: #999;
        }

        .format-icon {
            font-size: 12px;
        }

        .filter-controls {
            margin: 12px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-group label {
            font-weight: 500;
            font-size: 13px;
            color: #333;
            margin: 0;
        }

        .filter-buttons {
            display: flex;
            gap: 4px;
        }

        .filter-btn {
            padding: 4px 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #e8e8e8;
        }

        .filter-btn.active {
            background: #0366d6;
            color: white;
            border-color: #0366d6;
        }

        .sort-select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
            background: white;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .filter-controls {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .filter-group {
                width: 100%;
            }

            .sort-select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<h1>Library Assistant</h1>

<p>
    This page shows your StoryGraph or Goodreads
    “want to read” books and highlights Libby or Hoopla
    matches at Oakland and Berkeley libraries.
</p>

<form id="upload-form">

    <label for="books_file">
        Import a CSV export:
    </label>

    <input
        type="file"
        id="books_file"
        name="books_file"
        accept=".csv,text/csv"
        required
    >

</form>

<div id="status" class="status">
    <strong>Status:</strong>
    Select your CSV file to begin.
</div>

<div class="progress">
    <div id="progress-bar"></div>
</div>

<p id="progress-text"></p>

<div id="filter-controls" class="filter-controls" style="display: none;">
    <div class="filter-group">
        <label>Format:</label>
        <div class="filter-buttons">
            <button class="filter-btn active" data-format="all">All</button>
            <button class="filter-btn" data-format="audiobook">🎧 Audiobook</button>
            <button class="filter-btn" data-format="ebook">📖 eBook</button>
        </div>
    </div>

    <div class="filter-group">
        <label>Availability:</label>
        <div class="filter-buttons">
            <button class="filter-btn active" data-availability="all">All</button>
            <button class="filter-btn" data-availability="available">✓ Available</button>
            <button class="filter-btn" data-availability="waitlist">⧖ Waitlist</button>
        </div>
    </div>

    <div class="filter-group">
        <label>Sort:</label>
        <select id="sort-select" class="sort-select">
            <option value="availability">By Availability</option>
            <option value="title">By Title (A-Z)</option>
        </select>
    </div>
</div>

<div id="summary" class="summary"></div>

<div id="books-container"></div>


<script>

let jobId = null;
let statusTimer = null;
let allBooks = [];  // Store all books for filtering
let currentFilters = {
    format: "all",
    availability: "all",
    sort: "availability"
};


// Auto-submit when file is selected
document
    .getElementById("books_file")
    .addEventListener("change", async function(event) {

        const file = this.files[0];

        if (!file) {
            return;
        }

        document.getElementById("status").innerHTML =
            "<strong>Status:</strong> Uploading CSV…";

        document.getElementById("summary").innerHTML = "";

        document.getElementById("books-container").innerHTML = "";

        document.getElementById("progress-bar").style.width = "0%";

        document.getElementById("progress-text").textContent = "";

        const formData = new FormData();

        formData.append("books_file", file);

        try {

            const response = await fetch("/", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(
                    "Upload failed: " + response.status
                );
            }

            const data = await response.json();

            if (!data.job_id) {
                throw new Error(
                    "Server did not return a job ID."
                );
            }

            jobId = data.job_id;

            document.getElementById("status").innerHTML =
                "<strong>Status:</strong> Analysis started. " +
                data.total +
                " books queued.";

            startPolling();

        } catch (error) {

            document.getElementById("status").innerHTML =
                "<strong>Status:</strong> Upload failed: " +
                escapeHtml(error.message);
        }
    });


// Filter button event listeners
function setupFilterListeners() {
    // Only set up once
    if (document.body.dataset.filtersSetup === 'true') {
        return;
    }
    document.body.dataset.filtersSetup = 'true';

    // Format filters
    document.querySelectorAll('[data-format]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('[data-format]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilters.format = this.dataset.format;
            rerenderBooks();
        });
    });

    // Availability filters
    document.querySelectorAll('[data-availability]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('[data-availability]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilters.availability = this.dataset.availability;
            rerenderBooks();
        });
    });

    // Sort selector
    document.getElementById('sort-select').addEventListener('change', function() {
        currentFilters.sort = this.value;
        rerenderBooks();
    });
}


function rerenderBooks() {
    renderBooks(allBooks, true);
}


function startPolling() {

    if (statusTimer) {
        clearInterval(statusTimer);
    }

    pollStatus();

    statusTimer = setInterval(
        pollStatus,
        500
    );
}


async function pollStatus() {

    if (!jobId) {
        return;
    }

    try {

        const response = await fetch(
            "/status?job_id=" +
            encodeURIComponent(jobId)
        );

        if (!response.ok) {
            throw new Error(
                "Status request failed: " +
                response.status
            );
        }

        const data = await response.json();

        const total = data.total;

        const completed = data.completed;

        const percent = total
            ? Math.round(completed / total * 100)
            : 0;

        document.getElementById(
            "progress-bar"
        ).style.width = percent + "%";

        document.getElementById(
            "progress-text"
        ).textContent =
            completed +
            " of " +
            total +
            " books analyzed";

        if (data.finished) {

            clearInterval(statusTimer);

            document.getElementById(
                "status"
            ).innerHTML =
                "<strong>Status:</strong> Analysis complete.";

        } else {

            document.getElementById(
                "status"
            ).innerHTML =
                "<strong>Status:</strong> Analyzing books…";
        }

        renderBooks(data.books);

    } catch (error) {

        console.error(
            "Status error:",
            error
        );
    }
}
function renderBooks(books, isFiltering) {

    const container =
        document.getElementById(
            "books-container"
        );

    const summary =
        document.getElementById(
            "summary"
        );

    const filterControls = 
        document.getElementById(
            "filter-controls"
        );

    // Store books if not filtering (initial render)
    if (!isFiltering) {
        allBooks = books;
        filterControls.style.display = "flex";
        setupFilterListeners();
    }

    // Apply filters
    let filteredBooks = allBooks.filter(function(book) {
        
        const results = book.oakland || [];
        
        // Check if book has results matching BOTH format AND availability filters
        let hasMatch = results.some(function(r) {
            const fmt = (r.format || "").toLowerCase();
            
            // Check format filter
            let formatMatches = true;
            if (currentFilters.format !== "all") {
                if (currentFilters.format === "audiobook") {
                    formatMatches = fmt.includes("audio");
                } else if (currentFilters.format === "ebook") {
                    formatMatches = fmt.includes("ebook") || fmt.includes("book");
                }
            }
            
            if (!formatMatches) return false;
            
            // Check availability filter
            let availabilityMatches = true;
            if (currentFilters.availability !== "all") {
                if (currentFilters.availability === "available") {
                    availabilityMatches = r.available === true;
                } else if (currentFilters.availability === "waitlist") {
                    availabilityMatches = r.available === false && r.wait;
                }
            }
            
            return availabilityMatches;
        });
        
        return hasMatch;
    });

    // Sort
    if (currentFilters.sort === "title") {
        filteredBooks.sort(function(a, b) {
            return (a.title || "").localeCompare(b.title || "");
        });
    } else if (currentFilters.sort === "availability") {
        filteredBooks.sort(function(a, b) {
            const aResults = a.oakland || [];
            const bResults = b.oakland || [];
            const aAvailable = aResults.filter(r => r.available).length > 0 ? 0 : 1;
            const bAvailable = bResults.filter(r => r.available).length > 0 ? 0 : 1;
            return aAvailable - bAvailable;
        });
    }

    container.innerHTML = "";

    let availableBooks = 0;
    let waitlistBooks = 0;
    let noMatchBooks = 0;
    let errorBooks = 0;

    filteredBooks.forEach(function(book) {

        const results = book.oakland || [];
        const state = book.state || "unknown";

        // Count statuses and build availability info
        const availableResults = results.filter(r => r.available);
        const waitlistResults = results.filter(r => !r.available && r.wait);

        if (state === "error") {
            errorBooks++;
        } else if (availableResults.length > 0) {
            availableBooks++;
        } else if (waitlistResults.length > 0) {
            waitlistBooks++;
        } else {
            noMatchBooks++;
        }

        // Create book row
        const div = document.createElement("div");
        div.className = "book";

        // Determine status and indicator
        let indicatorClass = "checking";
        let indicator = "...";

        if (state === "error") {
            indicatorClass = "error";
            indicator = "!";
        } else if (state === "complete") {
            if (availableResults.length > 0) {
                indicatorClass = "available";
                indicator = "✓";
            } else if (waitlistResults.length > 0) {
                indicatorClass = "waitlist";
                indicator = "⧖";
            } else {
                indicatorClass = "checking";
                indicator = "○";
            }
        }

        // Indicator
        const indicatorDiv = document.createElement("div");
        indicatorDiv.className = "indicator " + indicatorClass;
        indicatorDiv.textContent = indicator;

        // Book info container
        const infoDiv = document.createElement("div");

        // Title and author
        const titleDiv = document.createElement("div");
        titleDiv.className = "book-info";

        const titleSpan = document.createElement("span");
        titleSpan.className = "book-title";
        titleSpan.textContent = book.title;

        const authorSpan = document.createElement("span");
        authorSpan.className = "author";
        authorSpan.textContent = book.author || "";

        titleDiv.appendChild(titleSpan);
        titleDiv.appendChild(authorSpan);

        infoDiv.appendChild(titleDiv);

        // Availability details
        if (state === "complete" && results.length > 0) {
            const availDiv = document.createElement("div");
            availDiv.className = "book-availability";

            // Group by format
            const byFormat = {};
            results.forEach(function(result) {
                const fmt = result.format || "Digital";
                if (!byFormat[fmt]) byFormat[fmt] = [];
                byFormat[fmt].push(result);
            });

            // Create items for each format
            Object.keys(byFormat).forEach(function(format) {
                const items = byFormat[format];
                
                // Get unique provider-library combos
                const combos = {};
                items.forEach(function(result) {
                    const lib = result.library || "Unknown";
                    const prov = result.provider || "Unknown";
                    const key = prov + "|" + lib;
                    
                    if (!combos[key]) {
                        combos[key] = {
                            provider: prov,
                            library: lib,
                            available: result.available,
                            wait: result.wait,
                            url: result.url
                        };
                    } else if (result.available && !combos[key].available) {
                        // Prefer available over waitlist
                        combos[key] = {
                            provider: prov,
                            library: lib,
                            available: result.available,
                            wait: result.wait,
                            url: result.url
                        };
                    }
                });

                // Create item for each combo
                Object.keys(combos).forEach(function(key) {
                    const combo = combos[key];
                    
                    const item = document.createElement("span");
                    let itemClass = combo.available ? "available" : "waitlist";
                    item.className = "availability-item " + itemClass;

                    // Format icon
                    let icon = "📚";
                    if (format.toLowerCase().includes("audio")) {
                        icon = "🎧";
                    } else if (format.toLowerCase().includes("ebook") || format.toLowerCase().includes("book")) {
                        icon = "📖";
                    }

                    // Library short name
                    let libShort = combo.library;
                    if (libShort.toLowerCase() === "oakland") {
                        libShort = "O";
                    } else if (libShort.toLowerCase() === "berkeley") {
                        libShort = "B";
                    }

                    // Provider
                    let provName = combo.provider;
                    if (provName === "Libby") {
                        provName = "Libby";
                    }

                    // Status
                    let statusText = combo.available ? "✓" : "⧖";

                    const text = document.createTextNode(
                        icon + " " + format + " (" + provName + "-" + libShort + ") " + statusText
                    );

                    item.appendChild(text);

                    // Make clickable if URL exists
                    if (combo.url) {
                        const link = document.createElement("a");
                        link.href = combo.url;
                        link.target = "_blank";
                        link.rel = "noopener";
                        link.style.color = "inherit";
                        link.style.textDecoration = "underline";
                        link.style.cursor = "pointer";
                        link.textContent = item.textContent;
                        item.textContent = "";
                        item.appendChild(link);
                    }

                    availDiv.appendChild(item);
                });
            });

            infoDiv.appendChild(availDiv);
        } else if (state === "error") {
            const errorDiv = document.createElement("div");
            errorDiv.className = "book-availability";
            errorDiv.style.color = "#dc3545";
            errorDiv.textContent = book.message || "Error";
            infoDiv.appendChild(errorDiv);
        }

        div.appendChild(indicatorDiv);
        div.appendChild(infoDiv);

        container.appendChild(div);
    });

    // Update summary
    const total = availableBooks + waitlistBooks + noMatchBooks + errorBooks;
    let summaryText = total + " shown";

    if (availableBooks > 0) {
        summaryText += " • " + availableBooks + " available";
    }

    if (waitlistBooks > 0) {
        summaryText += " • " + waitlistBooks + " waitlist";
    }

    if (noMatchBooks > 0) {
        summaryText += " • " + noMatchBooks + " no match";
    }

    if (errorBooks > 0) {
        summaryText += " • " + errorBooks + " error";
    }

    summary.textContent = summaryText;
}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
